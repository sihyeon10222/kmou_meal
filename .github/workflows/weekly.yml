name: KMOU Weekly Feed

on:
  workflow_dispatch:
    inputs:
      restaurant:
        description: '게시물 종류 (combined: 학식+교직원, badaro: 승선생활관)'
        type: choice
        options: [all, combined, badaro, dormitory]
        default: all
      date:
        description: '기준일의 다음 주 YYYY-MM-DD (비우면 한국시간 오늘)'
        type: string
      preview:
        description: '이미지만 생성'
        type: boolean
        default: true
      week:
        description: '대상 ISO 주차 YYYY-Www (date와 하나만 지정)'
        type: string
      force:
        description: '성공한 주차도 재게시'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: kmou-instagram-story
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Check and build
        run: npm run typecheck && npm test && npm run build
      - name: Render or publish feed
        shell: bash
        env:
          DATE: ${{ inputs.date }}
          PREVIEW: ${{ inputs.preview }}
          RESTAURANT: ${{ inputs.restaurant }}
          WEEK: ${{ inputs.week }}
          FORCE: ${{ inputs.force }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}
        run: |
          args=()
          if [ -n "$DATE" ]; then args+=(--date "$DATE"); fi
          if [ "$PREVIEW" = "true" ]; then args+=(--preview); fi
          args+=(--restaurant "$RESTAURANT")
          if [ -n "$WEEK" ]; then args+=(--week "$WEEK"); fi
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          npm run feed -- "${args[@]}"
      - name: Save images and receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: weekly-${{ github.run_id }}
          path: |
            output/*.jpg
            output/*.png
            output/*.json
          if-no-files-found: ignore
          retention-days: 7
