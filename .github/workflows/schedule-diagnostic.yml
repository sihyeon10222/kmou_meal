name: Temporary schedule diagnostic
run-name: Schedule diagnostic (${{ github.event.schedule }})
on:
  schedule:
    # Both entries target the same real moments: 03:50 / 03:55 KST.
    - cron: '50,55 18 * * *'
    - cron: '50,55 3 * * *'
      timezone: 'Asia/Seoul'
permissions: {}
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record scheduler event without publishing
        env:
          EVENT_NAME: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          echo "event=$EVENT_NAME cron=$CRON"
          date -u
          TZ=Asia/Seoul date
