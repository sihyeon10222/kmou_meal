name: Temporary schedule diagnostic
run-name: Schedule diagnostic (${{ github.event.schedule }})
on:
  schedule:
    # Isolate the UTC-only scheduler path from timezone-bearing workflows.
    - cron: '*/5 * * * *'
permissions: {}
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record scheduler event without publishing
        env:
          EVENT_NAME: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          echo "event=$EVENT_NAME cron=$CRON"
          date -u
          TZ=Asia/Seoul date
