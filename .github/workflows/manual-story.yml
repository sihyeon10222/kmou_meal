name: Manual KMOU Story

on:
  workflow_dispatch:
    inputs:
      restaurant:
        description: '식당'
        type: choice
        options: [dormitory, snack, teacher]
        default: dormitory
      meal:
        description: '끼니 (snack은 항상 한 장)'
        type: choice
        options: [full, breakfast, lunch, dinner]
        default: full
      date:
        description: '식단 날짜 YYYY-MM-DD (비우면 한국시간 오늘)'
        type: string
      preview:
        description: '이미지만 생성'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: kmou-instagram-story
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Check and build
        run: npm run typecheck && npm test && npm run build
      - name: Render or publish Stories
        shell: bash
        env:
          DATE: ${{ inputs.date }}
          PREVIEW: ${{ inputs.preview }}
          RESTAURANT: ${{ inputs.restaurant }}
          MEAL: ${{ inputs.meal }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}
        run: |
          args=()
          if [ -n "$DATE" ]; then args+=(--date "$DATE"); fi
          if [ "$PREVIEW" = "true" ]; then args+=(--preview); fi
          args+=(--restaurant "$RESTAURANT")
          args+=(--meal "$MEAL")
          npm run story -- "${args[@]}"
      - name: Save images and receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: story-${{ github.run_id }}
          path: |
            output/*.jpg
            output/*.png
            output/*.json
          if-no-files-found: ignore
          retention-days: 7
