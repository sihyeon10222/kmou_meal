name: Daily KMOU Story
run-name: Story · ${{ github.event_name }} · ${{ github.event.schedule || inputs.story_mode }}

on:
  schedule:
    - cron: '13 9 * * *' # 한국시간 09:13
      timezone: 'Asia/Seoul'
    - cron: '13 15 * * *' # 한국시간 15:13
      timezone: 'Asia/Seoul'
    - cron: '13 21 * * *' # 한국시간 21:13
      timezone: 'Asia/Seoul'
  workflow_dispatch:
    inputs:
      story_mode:
        description: '생성할 Story 종류'
        type: choice
        required: true
        options: [today_lunch, today_dinner, tomorrow_full]
        default: tomorrow_full
      preview_only:
        description: '이미지만 생성하고 게시하지 않기'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: kmou-instagram-story
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      - name: Determine story mode
        id: mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.story_mode }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            case "$EVENT_SCHEDULE" in
              "13 9 * * *") mode=today_lunch ;;
              "13 15 * * *") mode=today_dinner ;;
              "13 21 * * *") mode=tomorrow_full ;;
              *) echo "::error::Unmapped schedule: $EVENT_SCHEDULE"; exit 1 ;;
            esac
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            mode="$INPUT_MODE"
          else
            echo "::error::Unsupported event: $EVENT_NAME"; exit 1
          fi
          case "$mode" in
            today_lunch|today_dinner|tomorrow_full) ;;
            *) echo "::error::Invalid Story mode"; exit 1 ;;
          esac
          echo "story_mode=$mode" >> "$GITHUB_OUTPUT"
          echo "event=$EVENT_NAME schedule=$EVENT_SCHEDULE mode=$mode"
          {
            echo "Event: $EVENT_NAME"
            echo "Cron: $EVENT_SCHEDULE (Asia/Seoul)"
            echo "Mode: $mode"
            echo "Started (KST): $(date '+%Y-%m-%d %H:%M:%S %Z')"
          } >> "$GITHUB_STEP_SUMMARY"
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck && npm test && npm run build
      - name: Render or publish today's Story
        env:
          STORY_MODE: ${{ steps.mode.outputs.story_mode }}
          PREVIEW_ONLY: ${{ inputs.preview_only }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}
        run: |
          if [ "$PREVIEW_ONLY" = "true" ]; then
            npm run preview
          else
            npm start
          fi
      - name: Save rendered image and posting receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: story-${{ github.run_id }}
          path: |
            output/*.jpg
            output/*.json
          if-no-files-found: ignore
          retention-days: 7
