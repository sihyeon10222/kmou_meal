name: Daily KMOU Story
run-name: Story · ${{ inputs.run_mode }}

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: '개별 Story 또는 순차 게시 batch'
        type: choice
        required: true
        options:
          - today_lunch_batch
          - today_dinner_batch
          - tomorrow_full_batch
          - today_dormitory_lunch
          - today_dormitory_dinner
          - today_dormitory_full
          - tomorrow_dormitory_lunch
          - tomorrow_dormitory_dinner
          - tomorrow_dormitory_full
          - today_snack
          - tomorrow_snack
          - today_teacher_lunch
          - today_teacher_dinner
          - today_teacher_full
          - tomorrow_teacher_lunch
          - tomorrow_teacher_dinner
          - tomorrow_teacher_full
        default: tomorrow_full_batch

      base_date:
        description: '기준 날짜 YYYY-MM-DD (비우면 한국시간 오늘)'
        type: string
        required: false

      preview_only:
        description: '이미지만 생성하고 게시하지 않기'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: kmou-instagram-story
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TZ: Asia/Seoul

    steps:
      # 저장소 코드 가져오기
      - name: Checkout repository
        uses: actions/checkout@v7

      # Node.js 설정
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      # npm 패키지 설치
      - name: Install dependencies
        run: npm ci

      # cron-job.org 또는 수동 실행에서 전달된 Story mode 확인
      - name: Determine story mode
        id: mode
        shell: bash
        env:
          INPUT_MODE: ${{ inputs.run_mode }}
        run: |
          mode=$(node --import tsx scripts/resolve-workflow-mode.ts)
          echo "run_mode=$mode" >> "$GITHUB_OUTPUT"

          {
            echo "### KMOU Story Run"
            echo ""
            echo "- Event: ${{ github.event_name }}"
            echo "- Mode: $mode"
            echo "- Base date: ${{ inputs.base_date || '한국시간 오늘' }}"
            echo "- Started (KST): $(date '+%Y-%m-%d %H:%M:%S %Z')"
          } >> "$GITHUB_STEP_SUMMARY"

      # Playwright용 Chromium 설치
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # 타입 검사 + 테스트 + 빌드
      - name: Check and build
        run: npm run typecheck && npm test && npm run build

      # 이미지 생성 또는 실제 Instagram Story 게시
      - name: Render or publish Story
        env:
          RUN_MODE: ${{ steps.mode.outputs.run_mode }}
          BASE_DATE: ${{ inputs.base_date }}
          PREVIEW_ONLY: ${{ inputs.preview_only }}

          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}

          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}

        run: |
          if [ "$PREVIEW_ONLY" = "true" ]; then
            npm run preview
          else
            npm start
          fi

      # 생성 이미지와 게시 결과를 GitHub Artifact로 7일간 저장
      - name: Save rendered image and posting receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: story-${{ github.run_id }}
          path: |
            output/*.jpg
            output/*.json
          if-no-files-found: ignore
          retention-days: 7
