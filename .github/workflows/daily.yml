name: Daily KMOU Story

on:
  schedule:
    - cron: '13 9 * * *' # 오전 9시
      timezone: 'Asia/Seoul'
    - cron: '13 15 * * *' # 오후 3시
      timezone: 'Asia/Seoul'
    - cron: '13 21 * * *' # 오후 9시
      timezone: 'Asia/Seoul'
    # TEMPORARY TEST: 한국시간 02:32 에 다음날 전체 식단을 실행합니다.
    - cron: '17 3 * * *'
      timezone: 'Asia/Seoul'
  workflow_dispatch:
    inputs:
      story_mode:
        description: '생성할 Story 종류'
        type: choice
        required: true
        options: [today_lunch, today_dinner, tomorrow_full]
        default: tomorrow_full
      preview_only:
        description: '이미지만 생성하고 게시하지 않기'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: kmou-instagram-story
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      - name: Determine story mode
        id: mode
        shell: bash
        run: |
          case "${{ github.event.schedule }}" in
            "13 9 * * *") echo "story_mode=today_lunch" >> "$GITHUB_OUTPUT" ;;
            "13 15 * * *") echo "story_mode=today_dinner" >> "$GITHUB_OUTPUT" ;;
            "13 21 * * *") echo "story_mode=tomorrow_full" >> "$GITHUB_OUTPUT" ;;
            "17 3 * * *") echo "story_mode=tomorrow_full" >> "$GITHUB_OUTPUT" ;;
            *) echo "story_mode=${{ inputs.story_mode }}" >> "$GITHUB_OUTPUT" ;;
          esac
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck && npm test && npm run build
      - name: Render or publish today's Story
        env:
          STORY_MODE: ${{ steps.mode.outputs.story_mode }}
          PREVIEW_ONLY: ${{ inputs.preview_only }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}
        run: |
          if [ "$PREVIEW_ONLY" = "true" ]; then
            npm run preview
          else
            npm start
          fi
      - name: Save rendered image and posting receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: story-${{ github.run_id }}
          path: |
            output/*.jpg
            output/*.json
          if-no-files-found: ignore
          retention-days: 7
