<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <style>
    @font-face { font-family: Meal; src: url(data:font/ttf;base64,{{FONT}}) format('truetype'); font-weight: 100 900; font-display: block; }
    * { box-sizing: border-box; }
    html, body { width: 1080px; height: 1920px; margin: 0; }
    body { font-family: Meal, sans-serif; color: #183d44; background: #f5f1e7; -webkit-font-smoothing: antialiased; }
    .story { width: 1080px; height: 1920px; position: relative; overflow: hidden; }
    .story.today-lunch { background: #f5f1e7; }
    .story.today-dinner { background: #2259b1; color: #f5f1e7; }
    .night { position: absolute; top: 1038px; bottom: 0; left: 0; right: 0; background: #2259b1; }
    .today-lunch .night { display: none; }
    .today-dinner .night { display: none; }
    .today-dinner .school { color: #f5f1e7; }
    .no-menu .lunch, .no-menu .dinner { display: none; }
    .empty-state { display: none; position: absolute; left: 69px; right: 69px; top: 650px; text-align: center; font-size: 54px; font-weight: 650; letter-spacing: -2px; }
    .no-menu .empty-state { display: block; }
    header { position: absolute; left: 69px; right: 69px; top: 164px; }
    .eyebrow { font-size: 27px; font-weight: 650; letter-spacing: 4px; display: flex; align-items: center; gap: 21px; }
    .eyebrow::before { content: ''; display: block; width: 44px; height: 7px; background: #df713c; }
    .title-row { margin-top: 32px; }
    h1 { font-size: 73px; font-weight: 770; letter-spacing: -5px; line-height: 1.15; white-space: nowrap; margin: 32px 0 0; }
    .date, .school, .source-title { display: none; }
    section { position: absolute; left: 69px; right: 69px; }
    .lunch { top: 468px; height: 516px; }
    .dinner { top: 1112px; height: 540px; color: #f5f1e7; }
    .today-lunch .lunch { top: 530px; height: 900px; }
    .today-lunch .dinner { display: none; }
    .today-dinner .lunch { display: none; }
    .today-dinner .dinner { top: 530px; height: 900px; }
    .meal-heading { display: flex; align-items: center; border-bottom: 2px solid #183d4426; padding-bottom: 25px; gap: 24px; }
    .dinner .meal-heading { border-color: #f5f1e738; }
    h2 { font-size: 70px; font-weight: 760; letter-spacing: -2px; line-height: 1; margin: 0; }
    .english { font-size: 0; }
    .symbol { width: 48px; height: 48px; display: inline-block; flex-shrink: 0; }
    .sun { border-radius: 50%; background: #df5e27; box-shadow: 0 0 0 7px #ed956450; width: 34px; height: 34px; margin: 7px; }
    .moon { border-radius: 50%; box-shadow: inset 14px -9px 0 0 #d0dfa6; transform: rotate(-15deg); }
    .menu { height: calc(100% - 78px); padding-top: 35px; display: flex; flex-direction: column; justify-content: flex-start; gap: 15px; font-size: 50px; font-weight: 560; line-height: 1.36; letter-spacing: -1.8px; }
    .dish { margin: 0; overflow-wrap: anywhere; }
    .dish:first-child { font-weight: 760; }
    .empty { opacity: .7; font-weight: 450 !important; }
    footer { position: absolute; left: 69px; right: 69px; top: 1702px; color: #f5f1e7; border-top: 1px solid #f5f1e780; padding-top: 42px; display: flex; justify-content: space-between; align-items: center; }
    .today-lunch footer { color: #183d44; border-color: #183d4440; }
    .handle, .credit { font-size: 29px; font-weight: 450; letter-spacing: -.5px; }
  </style>
</head>
<body>
  <main class="story {{MODE_CLASS}}">
    <div class="night"></div>
    <header>
      <div class="eyebrow">KMOU DAILY MENU</div>
      <div class="title-row"><h1>{{DISPLAY_TITLE}}</h1><span class="source-title">{{TITLE}}</span><div class="date">{{DATE}}<small>{{WEEKDAY}}</small></div></div>
      <div class="school">국립한국해양대학교 학생생활관</div>
    </header>
    <section class="lunch" aria-label="점심 메뉴">
      <div class="meal-heading"><span class="symbol sun"></span><h2>Lunch</h2><span class="english">LUNCH</span></div>
      <div class="menu">{{LUNCH}}</div>
    </section>
    <section class="dinner" aria-label="저녁 메뉴">
      <div class="meal-heading"><span class="symbol moon"></span><h2>Dinner</h2><span class="english">DINNER</span></div>
      <div class="menu">{{DINNER}}</div>
    </section>
    <div class="empty-state">{{EMPTY_MESSAGE}}</div>
    <footer><div class="handle">@kmou_meal</div><div class="credit">제작: 인공지능공학부 김시현</div></footer>
  </main>
</body>
</html>
